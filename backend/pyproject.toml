[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "donghuangji-chatbi"
version = "0.1.0"
description = "Evidence-first competitive intelligence ChatBI for Donghuangji"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "openai>=1.60,<3.0",
  "fastmcp>=2.0,<5.0",
  "numpy>=2.0,<3.0",
  "jieba>=0.42,<1.0",
  "markdown-it-py>=3.0,<5.0",
  "FlagEmbedding>=1.3,<2.0",
  "sentence-transformers>=3.0,<6.0",
  "transformers>=4.44,<5.0",
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "celery[redis]>=5.4,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5,<7",
  "boto3>=1.35,<2.0",
  "requests>=2.32,<3.0",
  "beautifulsoup4>=4.12,<5.0",
  "lxml>=5.0,<7.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
filterwarnings = [
  "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
